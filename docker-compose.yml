services:
  nginx:
    image: nginx:latest
    ports:
      - 4432:443
    volumes:
      - ./davx.infra.1995parham.me:/etc/nginx/ssl/davx.infra.1995parham.me:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      xandikos:
        condition: service_healthy
    restart: unless-stopped
  xandikos:
    image: ghcr.io/jelmer/xandikos:v0.3.4
    volumes:
      - .:/data:rw
    environment:
      - AUTOCREATE=true
      - DEFAULTS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
