services:
  nginx:
    image: nginx:latest
    ports:
      - 4432:443
    volumes:
      - ./davx.infra.1995parham.me:/etc/nginx/ssl/davx.infra.1995parham.me:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      xandikos:
        condition: service_healthy
    restart: unless-stopped
  xandikos:
    # Pinned 2026-07-20: xandikos 0.4.4 / dulwich 1.2.11 (upgrade from dulwich 1.2.6
    # to pick up git-store concurrency fixes for the zlib REPORT 500s). Was `:latest`.
    image: ghcr.io/jelmer/xandikos:latest@sha256:6c0301123d32e26c2915f48081ffc84c7678e80c15692dbf7f1c5b3e45191bfb
    volumes:
      - .:/data:rw
      # Hotfix for dulwich _GitFile.close() lock race that leaves .git/index stale
      # and makes the next PUT silently revert a contact. See patches/sitecustomize.py.
      - ./patches/sitecustomize.py:/patches/sitecustomize.py:ro
    environment:
      - PYTHONPATH=/patches:/code
      - AUTOCREATE=true
      - DEFAULTS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
